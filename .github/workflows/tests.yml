name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The ends of the supported range on Linux, and Windows in between.
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
          # The newest Python the dependencies publish wheels for.
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (with the C extension, which must compile)
        env:
          PYRULEANALYZER_REQUIRE_EXTENSION: "1"
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q

  minimum-versions:
    # The lowest bounds pyproject.toml declares, on the oldest Python: every
    # one of these publishes cp39 wheels. scipy is pinned to a release of the
    # same period (it supports numpy 1.21 and scikit-learn 1.0 was tested
    # against it) instead of whatever the resolver backtracks to.
    name: ubuntu-latest / Python 3.9 / minimum dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Pin the lowest supported versions
        # PIP_CONSTRAINT also applies inside pip's isolated build environment,
        # so the C extension is compiled against numpy 1.21 as well, and the
        # unpinned dependencies (matplotlib, ...) resolve to releases that
        # accept these versions instead of upgrading them.
        run: |
          printf '%s\n' "numpy==1.21.0" "pandas==1.3.0" "scikit-learn==1.0" \
            "scipy==1.7.3" > "$RUNNER_TEMP/min-versions.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/min-versions.txt" >> "$GITHUB_ENV"
      - name: Install (with the C extension, which must compile)
        env:
          PYRULEANALYZER_REQUIRE_EXTENSION: "1"
        run: python -m pip install -e ".[test]"
      - name: Show the installed versions
        run: python -c "import numpy, pandas, sklearn, scipy; print(numpy.__version__, pandas.__version__, sklearn.__version__, scipy.__version__)"
      - name: Test
        run: python -m pytest -q
